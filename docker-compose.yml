services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cortex-api
    env_file:
      - apps/api/.env
    environment:
      CLIENT_ORIGIN: http://localhost:3000
      QDRANT_URL: http://qdrant:6333
    ports:
      - "4000:4000"
    depends_on:
      - qdrant

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: cortex-web
    ports:
      - "3000:3000"
    depends_on:
      - api

  mongo:
    image: mongo:7
    container_name: cortex-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: cortex-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mongo-data:
  qdrant-data:
